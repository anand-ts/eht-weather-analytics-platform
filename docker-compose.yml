version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: data_stream_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: data_stream
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./data:/data/import
    networks:
      - data_stream_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: data_stream_backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017/data_stream
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    volumes:
      - ./data:/app/data
    networks:
      - data_stream_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: data_stream_frontend
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - data_stream_network

volumes:
  mongodb_data:

networks:
  data_stream_network:
    driver: bridge
